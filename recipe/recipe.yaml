schema_version: 1

context:
  name: conda-forge-feedstock-ops
  version: "0.20.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/regro/conda-forge-feedstock-ops/archive/refs/tags/${{ version }}.tar.gz
  sha256: bf69ba6ff242dc12a1838b8ab5beedc8f35ff057f7e4d23e9ccbacac4509473b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - conda-forge-feedstock-ops-container = conda_forge_feedstock_ops.__main__:main_container

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools_scm
  run:
    - python >=${{ python_min }}
    - boltons >=23.0.0
    - click
    - conda
    - conda-build >=2026
    - conda-forge-metadata >=2026.9.5
    - conda-package-handling
    - conda-recipe-manager >=0.10.6
    - conda-smithy >=2026
    - jinja2
    - orjson
    - pixi
    - py-rattler >=0.22.0,<0.26a0
    - pydantic >=2.13
    - pydantic-settings >=2.15.0,<3.0.0
    - rattler-build-conda-compat >=1.4.15,<2.0.0a0
    - requests
    - ruamel.yaml
    - ruamel.yaml.jinja2
    - wurlitzer
    - zstandard

tests:
  - python:
      imports:
        - conda_forge_feedstock_ops
        - conda_forge_feedstock_ops.check_solvable
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - python -c "import conda_forge_feedstock_ops; assert conda_forge_feedstock_ops.__version__ == '${{ version }}'"
      - conda-forge-feedstock-ops-container --help

about:
  summary: A package of containerized feedstock maintenance operations
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/regro/conda-forge-feedstock-ops

extra:
  recipe-maintainers:
    - beckermr
